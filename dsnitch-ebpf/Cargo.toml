[package]
name = "dsnitch-ebpf"
version = "0.1.0"
edition = "2021"

[dependencies]
aya-ebpf = "0.2.1"
aya-log-ebpf = "0.2.0"
dsnitch-common = { path = "../dsnitch-common" }

[[bin]]
name = "dsnitch"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 2
debug = true
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
codegen-units = 1
