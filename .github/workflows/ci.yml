name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Rust toolchains (nightly with rust-src for eBPF + stable for userspace)
      - name: Install Nightly Rust (with rust-src)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      # 2. Install bpf-linker via pre-built binary
      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker

      # 3. Cache dependencies
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 4. Build eBPF Bytecode
      - name: Build eBPF Bytecode
        run: cargo xtask build-ebpf --release

      # 5. Build dsnitch Release Binary
      - name: Build dsnitch Release
        run: cargo build --release
